name: CI

# PHP 8.2/8.3/8.4 (Linux). Runs the lib's own gates: PHPStan (level 8) ->
# PHPUnit -> PHP-CS-Fixer (PER-CS dry-run). composer.lock is pinned to the
# 8.2.0 platform floor, so resolution is identical across the matrix.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (php ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Composer security audit
        # Blocking: a runtime dependency with a published advisory fails CI.
        run: composer audit --no-dev --format=plain

      - name: PHPStan (level 8)
        # Explicit limit: a parallel worker that hits the php.ini memory_limit
        # dies mid-run and leaves an incomplete analysis.
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: PHPUnit
        run: composer test

      - name: PHP-CS-Fixer (PER-CS dry-run)
        run: composer cs-check
